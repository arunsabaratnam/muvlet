name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check title and linked issue
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          types='feat|fix|chore|docs|refactor|test'
          if ! [[ "$TITLE" =~ ^($types)(\([^\)]+\))?!?:\ .+ ]]; then
            echo "::error::PR title must look like 'type: summary', where type is one of: ${types//|/, }. Got: $TITLE"
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "docs" ]] && ! grep -qiE 'closes #[0-9]+' <<< "$BODY"; then
            echo "::error::PR description must link an issue with 'Closes #<number>' (only docs: PRs are exempt)."
            exit 1
          fi
          echo "PR title and description look good."
